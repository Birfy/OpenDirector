<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafb" />
    <script>
      // Restore before styles and React load. Keep aligned with settings/theme.ts.
      (() => {
        let theme = 'light';
        try { if (localStorage.getItem('museshow.theme.v1') === 'dark') theme = 'dark'; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1c1d23' : '#fafafb';
      })();
    </script>
    <style>
      html { background: #fafafb; color-scheme: light; }
      html[data-theme="dark"] { background: #1c1d23; color-scheme: dark; }
    </style>
    <meta name="description" content="MuseShow 视频创作工作台" />
    <link rel="icon" type="image/png" href="/src/assets/logo/logo.png" />
    <title>MuseShow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
